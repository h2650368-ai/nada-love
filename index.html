<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رسالة ليكي ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif}
body{
  overflow:hidden;
  background:radial-gradient(circle at 50% 35%,#101d3d 0,#071127 42%,#030712 100%);
  color:#fff;
}
#hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.heart{
  position:absolute;top:-40px;color:#ff4264;font-size:var(--s);
  filter:drop-shadow(0 0 8px #ff214b);
  animation:fall var(--d) linear var(--delay) infinite;
  opacity:.8
}
@keyframes fall{
  0%{transform:translate3d(0,-50px,0) rotate(0deg);opacity:0}
  10%{opacity:.85}
  100%{transform:translate3d(var(--x),110vh,0) rotate(360deg);opacity:0}
}
.screen{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;transition:opacity .5s,transform .5s
}
.card{text-align:center;width:min(430px,94vw);position:relative;z-index:2}
h1{font-size:clamp(28px,8vw,46px);margin:0 0 8px;text-shadow:0 0 18px #ff315a}
.sub{color:#c9d1e8;margin:0 0 30px;font-size:15px}
.envelope{
  width:min(330px,82vw);height:215px;margin:0 auto 28px;position:relative;
  cursor:pointer;transform:translateY(0);transition:.35s;
  filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))
}
.envelope:hover{transform:translateY(-7px) scale(1.02)}
.env-body{
  position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(145deg,#151c31,#080c18);
  border:1px solid rgba(255,70,100,.45);box-shadow:inset 0 0 35px rgba(255,40,75,.08)
}
.env-body:before,.env-body:after{
  content:"";position:absolute;bottom:0;width:72%;height:2px;background:#a91e3d;opacity:.8
}
.env-body:before{left:-2px;transform:rotate(31deg);transform-origin:left}
.env-body:after{right:-2px;transform:rotate(-31deg);transform-origin:right}
.flap{
  position:absolute;top:1px;left:0;width:100%;height:62%;
  background:linear-gradient(145deg,#202941,#0b1020);
  clip-path:polygon(0 0,100% 0,50% 100%);
  border-radius:12px 12px 0 0;border:1px solid rgba(255,70,100,.3)
}
.seal{
  position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);
  width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle,#ff4b6b,#9f1235 65%,#4a0a1a);
  box-shadow:0 0 25px rgba(255,40,75,.7);font-size:30px
}
.hint{color:#aeb9d5;font-size:14px}
.btn{
  border:0;border-radius:999px;padding:13px 28px;background:linear-gradient(90deg,#b92b52,#ed4166);
  color:white;font-size:16px;font-weight:bold;box-shadow:0 8px 25px rgba(220,40,85,.25);cursor:pointer
}
.hidden{opacity:0;transform:scale(.96);pointer-events:none}
.letter-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.letter{
  width:min(440px,92vw);max-height:82vh;overflow:auto;padding:34px 25px 28px;
  background:linear-gradient(145deg,#fff9ed,#f3e4c7);color:#29231f;border-radius:4px;
  box-shadow:0 25px 70px rgba(0,0,0,.6),0 0 25px rgba(255,255,255,.08);
  transform:rotate(-1deg);position:relative
}
.letter:before{
  content:"";position:absolute;inset:12px;border:1px solid rgba(120,70,40,.25);pointer-events:none
}
.letter h2{margin:0 0 18px;color:#9e1835;font-size:25px}
.message{font-size:19px;line-height:2.05;white-space:pre-line;position:relative}
.signature{margin-top:20px;color:#9e1835;font-weight:bold;font-size:17px}
.back{margin-top:22px;background:#171e35}
@media(max-height:650px){.envelope{height:175px}.letter{max-height:88vh}.message{font-size:17px}}
</style>
</head>
<body>
<div id="hearts"></div>

<section id="home" class="screen">
  <div class="card">
    <h1>رسالة ليكي ❤️</h1>
    <p class="sub">في جواب صغير مستنيكي...</p>
    <div class="envelope" onclick="openLetter()" aria-label="افتحي الجواب">
      <div class="env-body"></div>
      <div class="flap"></div>
      <div class="seal">♥</div>
    </div>
    <div class="hint">اضغطي على الجواب عشان تفتحيه ✨</div>
  </div>
</section>

<section id="letterScreen" class="screen hidden">
  <div class="letter-wrap">
    <article class="letter">
      <h2>بصي بقي يا نور عيني ❤️</h2>
      <div class="message">انت بحبك وبحبك اوي اوي فوق ما تتخيلي
وعمري ماهستغني عنك مهما حصل
جنبك في كل الظروف الصعبه والحلوه،

مشتريكي ويارب ما تخيبي ظني فيكي،
وان شاء الله نكون مع بعض في الحلال
يا روحي 🤍😍😍</div>
      <div class="signature">من حسين ❤️</div>
      <button class="btn back" onclick="closeLetter()">اضغطي للعودة</button>
    </article>
  </div>
</section>

<script>
const heartBox=document.getElementById('hearts');
for(let i=0;i<34;i++){
  const h=document.createElement('span');
  h.className='heart';
  h.textContent=Math.random()>.18?'♥':'♡';
  h.style.left=Math.random()*100+'%';
  h.style.setProperty('--s',(10+Math.random()*16)+'px');
  h.style.setProperty('--x',(-70+Math.random()*140)+'px');
  h.style.setProperty('--d',(5+Math.random()*7)+'s');
  h.style.setProperty('--delay',(-Math.random()*10)+'s');
  heartBox.appendChild(h);
}
function openLetter(){
  document.getElementById('home').classList.add('hidden');
  setTimeout(()=>document.getElementById('letterScreen').classList.remove('hidden'),220);
}
function closeLetter(){
  document.getElementById('letterScreen').classList.add('hidden');
  setTimeout(()=>document.getElementById('home').classList.remove('hidden'),220);
}
</script>
</body>
</html>
